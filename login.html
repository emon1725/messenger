
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ChatSphere</title>

    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="auth-container">

    <div class="auth-brand">
        <div class="brand-logo">
            <i class="fas fa-comments"></i>
        </div>

        <h1>Chat<span>Sphere</span></h1>
        <p>Connect • Chat • Share</p>

        <div class="brand-message">
            <h2>Welcome Back!</h2>
            <p>Stay connected with the people who matter most.</p>
        </div>
    </div>

    <div class="auth-form-container">

        <form id="loginForm" class="auth-form">

            <h2>Sign In</h2>
            <p class="form-subtitle">Welcome back! Please login to your account.</p>

            <div class="form-group">
                <label>Email Address</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required>
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>
                </div>
            </div>

            <div class="form-options">
                <label>
                    <input type="checkbox" id="rememberMe">
                    Remember me
                </label>

                <a href="#" id="forgotPassword">Forgot Password?</a>
            </div>

            <button type="submit" class="auth-btn" id="loginBtn">
                Sign In <i class="fas fa-arrow-right"></i>
            </button>

            <p id="authMessage" class="auth-message"></p>

            <div class="oauth-divider"><span>or</span></div>

            <button type="button" class="google-btn" id="googleSignInBtn">
                <i class="fab fa-google"></i>
                Continue with Google
            </button>


            <div class="auth-footer">
                Don't have an account?
                <a href="signup.html">Create Account</a>
            </div>

        </form>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
