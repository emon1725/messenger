
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | ChatSphere</title>

    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="auth-container">

    <div class="auth-brand">

        <div class="brand-logo">
            <i class="fas fa-comments"></i>
        </div>

        <h1>Chat<span>Sphere</span></h1>
        <p>Connect • Chat • Share</p>

        <div class="brand-message">
            <h2>Join Our Community!</h2>
            <p>Create your account and start connecting with everyone.</p>
        </div>

    </div>


    <div class="auth-form-container">

        <form id="signupForm" class="auth-form">

            <h2>Create Account</h2>
            <p class="form-subtitle">
                Join ChatSphere and stay connected.
            </p>

            <div class="form-group">
                <label>Full Name</label>

                <div class="input-wrapper">
                    <i class="fas fa-user"></i>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        maxlength="80"
                        autocomplete="name"
                        required>
                </div>
            </div>


            <div class="form-group">
                <label>Email Address</label>

                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required>
                </div>
            </div>


            <div class="form-group">
                <label>Password</label>

                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>

                    <input
                        type="password"
                        id="password"
                        placeholder="Minimum 8 characters"
                        minlength="8"
                        autocomplete="new-password"
                        required>
                </div>
            </div>


            <div class="form-group">
                <label>Confirm Password</label>

                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        minlength="8"
                        autocomplete="new-password"
                        required>
                </div>
            </div>


            <label class="terms">
                <input type="checkbox" id="terms" required>
                I agree to the Terms & Conditions.
            </label>


            <button type="submit" class="auth-btn" id="signupBtn">
                Create Account
                <i class="fas fa-arrow-right"></i>
            </button>

            <p id="authMessage" class="auth-message"></p>


            <div class="oauth-divider"><span>or</span></div>

            <button type="button" class="google-btn" id="googleSignInBtn">
                <i class="fab fa-google"></i>
                Continue with Google
            </button>


            <div class="auth-footer">
                Already have an account?
                <a href="login.html">Sign In</a>
            </div>

        </form>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
